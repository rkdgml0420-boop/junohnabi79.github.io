const fm=t=>{let[a,m]=t.split(':');a=+a;return(a<12?'오전 ':'오후 ')+(a%12||12)+':'+m};
function parse(s){return s.trim().split('\n').map(l=>{if(l[0]=='@')return{dv:l.slice(1)};const m=l.match(/^(\d\d:\d\d)([>*]?)(.*)$/);return{time:fm(m[1]),w:m[2]=='>'?'me':'A',un:m[2]=='*',t:m[3]}})}
const S={scr:'off',unread:{...DATA.unread},wrong:0,pin:'',uid:9},APP={},RM={},UN={},SM={},SU={};
for(const k in DATA.rooms){RM[k]=parse(DATA.rooms[k]);UN[k]=RM[k].filter(m=>m.un).length}
for(const k in DATA.sms){SM[k]=parse(DATA.sms[k]);SU[k]=SM[k].filter(m=>m.un).length}
let N=DATA.notifs.map((n,i)=>({...n,id:i}));
function fit(){const s=Math.min(innerWidth/402,innerHeight/760),p=$('#phone');p.style.height=innerHeight/s+'px';p.style.transform=`scale(${s})`;$('#w').style.width=402*s+'px';$('#w').style.height=innerHeight+'px'}addEventListener('resize',fit);fit();
$('#lt').textContent=DATA.lt;$('#ld').textContent=DATA.date;$('#hm').textContent=DATA.lt;$('#hd').textContent=DATA.date;
function go(id){document.querySelectorAll('.s').forEach(e=>e.classList.toggle('on',e.id==id));S.scr=id;$('#phone').classList.toggle('lt',id=='app'&&(!!S.room||$('#app').classList.contains('kl')));const o=id=='off'||id=='boot';$('#sb').style.display=o?'none':'flex';$('#di').style.display=id=='off'?'none':'block';$('#hb').style.display=o?'none':'block';$('#offb').hidden=o||id=='call';$('#cp2').textContent=id=='off'?'화면을 눌러 휴대폰을 켜 보세요':'화면을 눌러 직접 만져보세요'}
function toast(t){const e=$('#ts');e.textContent=t;e.style.display='block';clearTimeout(S.tt);S.tt=setTimeout(()=>e.style.display='none',2400)}
function vib(){const p=$('#phone');p.classList.add('vib');setTimeout(()=>p.classList.remove('vib'),260)}
function card(n,a){const [,c,g]=AP[n.app];const e=E('div','nc'+(a?' in':''),`<i class="ic" style="background:${c}">${g}</i><div><b>${n.who}</b><small>${n.time}</small><p>${n.t}</p></div>`);return e}
function renderLock(){const l=$('#nl');l.innerHTML='';N.forEach(n=>l.append(card(n)))}
const rm=a=>{N=N.filter(n=>n.app!=a)};
async function arrive(){S.locking=1;const L=[...N].reverse(),k=L.length;$('#nl').innerHTML='';$('#lh').textContent='';for(let i=0;i<k;i++){await sl(i<k-3?380:380+(i-k+4)*320);$('#nl').prepend(card(L[i],1));if(i<k-2)vib()}S.locking=0;$('#lh').textContent='화면을 눌러 잠금 해제'}
function notify(app,who,t){const n={app,who,t,time:'지금',id:++S.uid};N.unshift(n);if(S.scr=='lock'){$('#nl').prepend(card(n,1));vib()}else if(S.scr=='home'||S.scr=='app')ban(n)}
function ban(n){const b=$('#ban');b.innerHTML='';b.append(card(n));b.className='on';b.onclick=()=>{b.className='';if(S.lock)return;openApp(n.app,n.app=='kakao')};clearTimeout(S.bt);S.bt=setTimeout(()=>b.className='',3200)}
function badges(){for(const k of['kakao','msg','phone']){const e=$('#b-'+k);e.textContent=S.unread[k];e.style.display=S.unread[k]?'grid':'none'}}
$('#off').onclick=()=>{if(!S.booted){S.booted=1;go('boot');sl(2000).then(()=>{go('lock');arrive()})}else{go('lock');renderLock();$('#lh').textContent='화면을 눌러 잠금 해제'}};
$('#lock').onclick=()=>{if(S.locking)return;S.pin='';dots();$('#pe').textContent='';go('pass')};
$('#offb').onclick=()=>{if(S.locking)return;S.room=null;go('off');};
const pd=[...'123456789','','0','⌫'];pd.forEach(k=>{const b=E('b','',k);if(!k)b.style.background='none';else b.onclick=()=>key(k);$('#pad').append(b)});
addEventListener('keydown',e=>{if(S.scr=='pass'){if(/^\d$/.test(e.key))key(e.key);else if(e.key=='Backspace')key('⌫')}});
function dots(){[...$('#dots').children].forEach((d,i)=>d.classList.toggle('f',i<S.pin.length))}
function key(k){if(S.scr!='pass'||S.busy)return;if(k=='⌫')S.pin=S.pin.slice(0,-1);else if(S.pin.length<4)S.pin+=k;dots();if(S.pin.length<4)return;if(S.pin==DATA.pin){S.pin='';go('home');badges()}else{S.wrong++;S.busy=1;$('#dots').classList.add('shake');$('#pe').textContent='암호가 맞지 않아요';if(S.wrong>=DATA.wrongHint)$('#ph').textContent='힌트: '+DATA.hint;setTimeout(()=>{$('#dots').classList.remove('shake');S.pin='';S.busy=0;dots()},500)}}
['map','naver','memo','gal','msg','kakao','phone','cal'].forEach(k=>{const [n,c,g]=AP[k],e=E('div','ap',`<div class="ai" style="background:${c}">${g}<span class="bd" id="b-${k}"></span></div>${n}`);e.onclick=()=>openApp(k);$('#ic').append(e)});
function sunny(){S.sun=1;const w=$('#wx');w.classList.add('out');setTimeout(()=>{w.textContent='☁️ 성동구 · 9° 흐림';w.classList.remove('out')},900)}
